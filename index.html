<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" href="./icon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Leen TV</title>
    <meta name="description" content="Stream live TV, movies, and series from your M3U, Xtream, Plex, or Jellyfin sources. Browse a unified library, follow live guides, save favorites, and pick up where you left off." />
    <meta property="og:title" content="Leen TV" />
    <meta property="og:description" content="Stream live TV, movies, and series from your M3U, Xtream, Plex, or Jellyfin sources. Browse a unified library, follow live guides, save favorites, and pick up where you left off." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Leen TV" />
    <meta name="twitter:description" content="Stream live TV, movies, and series from your M3U, Xtream, Plex, or Jellyfin sources. Browse a unified library, follow live guides, save favorites, and pick up where you left off." />
    <style>
      /* animated boot splash, built for old TV GPUs: flat colours, every animation is transform/opacity (compositor), no clip-path / stroke-dash / filter.
         Same artwork as public/logo.svg: the tile settles in, a cover in the tile's colour slides off right to left so the name is written the way Arabic runs
         (low thump), the three dots drop in (bell arpeggio), then the name and a slim loader. */
      #splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#0e0f11;color:#fff;font-family:"Google Sans","Product Sans",Roboto,"Segoe UI",system-ui,sans-serif;transition:opacity .45s ease}
      #splash.hide{opacity:0;pointer-events:none}
      .sp-mark{position:relative;width:144px;height:144px;margin-top:-4vh;border-radius:35px;overflow:hidden;opacity:0;transform:scale(.92);will-change:transform,opacity;animation:sp-in .5s cubic-bezier(.2,.9,.3,1) .05s forwards}
      .sp-mark svg{position:absolute;top:0;left:0;width:100%;height:100%}
      .sp-cover{position:absolute;top:10%;bottom:10%;left:12%;width:76%;background:#145ce6;will-change:transform;animation:sp-wipe .95s cubic-bezier(.6,0,.3,1) .3s forwards}
      .sp-mark .d{transform-box:fill-box;transform-origin:50% 50%;opacity:0;transform:translateY(-8px) scale(.4);animation:sp-in .45s cubic-bezier(.3,1.4,.6,1) forwards}
      .sp-mark .d1{animation-delay:1.1s}.sp-mark .d2{animation-delay:1.22s}.sp-mark .d3{animation-delay:1.32s}
      .sp-name{margin-top:28px;font-size:26px;font-weight:500;opacity:0;transform:translateY(8px);animation:sp-in .5s cubic-bezier(.2,.9,.3,1) 1.3s forwards}
      .sp-name span{color:rgba(255,255,255,.55)}
      .sp-line{position:absolute;bottom:12vh;left:50%;width:120px;height:3px;margin-left:-60px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,.1);opacity:0;animation:sp-in .3s ease-out 1.6s forwards}
      .sp-line i{position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:2px;background:#fff;will-change:transform;animation:sp-load 1.2s cubic-bezier(.4,0,.2,1) 1.6s infinite}
      @keyframes sp-in{to{opacity:1;transform:none}}
      @keyframes sp-wipe{to{transform:translateX(-102%)}}
      @keyframes sp-load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @media (max-width:600px){.sp-mark{width:112px;height:112px;border-radius:27px}.sp-name{font-size:22px}}
      /* reduced motion / motion=off: show the final frame immediately */
      @media (prefers-reduced-motion: reduce){#splash *{animation:none!important;opacity:1!important;transform:none!important}#splash .sp-cover{display:none!important}}
      #splash.static *{animation:none!important;opacity:1!important;transform:none!important}
      #splash.static .sp-cover{display:none!important}
    </style>

    <style>html{background:#0e0f11;color:#fff}html:not(.dark){background:#f4f5f7;color:#1f1f1f}</style>
    <script>
      // set the theme before first paint (no flash); mirrors src/lib/theme.ts
      // the persisted store is parsed ONCE here and handed to main.tsx as window.__leenBoot (a big store costs a TV real time per parse)
      var st = null
      try { st = JSON.parse(localStorage.getItem("iptv-app")) } catch (e) {}
      window.__leenBoot = st
      var ss = (st && st.state && st.state.settings) || {}
      var t = ss.theme
      document.documentElement.dataset.theme = ss.colorTheme || "default"
      var tv = /Web0S|webOS|SmartTV/i.test(navigator.userAgent)
      // language / direction before first paint; mirrors src/lib/i18n
      var lg = ss.language
      var ar = lg === "ar" || (lg !== "en" && /^ar/i.test(navigator.language))
      document.documentElement.lang = ar ? "ar-EG" : "en"
      document.documentElement.dir = ar ? "rtl" : "ltr"
      document.documentElement.dataset.lang = ar ? "ar" : "en"
      document.documentElement.classList.toggle("dark", t === "dark" || (t !== "light" && (tv || matchMedia("(prefers-color-scheme: dark)").matches)))
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <!-- the mark of public/logo.svg (LeenMark): the cover (tile colour) slides off right to left to write the line, then the dots drop in -->
      <div class="sp-mark" dir="ltr">
        <svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#145ce6" /><path transform="translate(2 0)" d="M74 20V58A8 8 0 0 1 66 66H56V54V66H46A12 12 0 0 1 22 66V56" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <div class="sp-cover"></div>
        <svg viewBox="0 0 100 100"><g transform="translate(2 0)" fill="#0e0f11"><circle class="d d1" cx="34" cy="53" r="4.6" /><circle class="d d2" cx="53.5" cy="79" r="4.6" /><circle class="d d3" cx="63" cy="79" r="4.6" /></g></svg>
      </div>
      <div class="sp-name" dir="ltr">Leen <span>TV</span></div>
      <div class="sp-line"><i></i></div>
    </div>
    <script>
      // splash chime (cold start only, same rule as the intro in main.tsx; Settings > Display > Startup sound = settings.splashSound, device-local): a soft low thump with the tile, a bell arpeggio as the three dots drop in.
      // Synthesised (no audio file to load from file://). Browsers that block audio without a tap (a plain tab) stay silent; webOS and installed PWAs play it.
      try {
        if (ss.splashSound !== false && sessionStorage.getItem("leen-splash") !== "1" && window.AudioContext) {
          var ac = new AudioContext(), t0 = performance.now()
          var tone = function (f, f2, at, len, vol, type) {
            var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at
            o.type = type || "sine"
            o.frequency.setValueAtTime(f, t)
            if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + len)
            g.gain.setValueAtTime(0.0001, t)
            g.gain.exponentialRampToValueAtTime(vol, t + 0.015)
            g.gain.exponentialRampToValueAtTime(0.0001, t + len)
            o.connect(g); g.connect(ac.destination)
            o.start(t); o.stop(t + len + 0.05)
          }
          ac.resume().then(function () {
            // ponytail: a context that only starts on a later key press would chime late, so a late start stays silent
            if (ac.state !== "running" || performance.now() - t0 > 800) return ac.close()
            tone(130, 55, 0.3, 0.45, 0.35)
            ;[659.25, 880, 1318.5].forEach(function (f, i) { // one note per dot as it drops in
              tone(f, 0, 1.1 + i * 0.11, 1.6, 0.12)
              tone(f * 2, 0, 1.1 + i * 0.11, 0.6, 0.03, "triangle")
            })
            setTimeout(function () { ac.close() }, 3000)
          })
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
