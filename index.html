<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" href="./icon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Leen TV</title>
    <style>
      /* animated boot splash: light beams sweep past, the tile springs in, the triangle draws and a sheen crosses it, the wordmark reveals and a slim loader runs until the app is ready.
         Only transform/opacity/clip-path (+ one stroke draw on a tiny SVG); no blur or radial gradients, so weak TV GPUs stay smooth. */
      #splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;overflow:hidden;background:linear-gradient(180deg,#10151d 0%,#0b0d10 60%);color:#fff;transition:opacity .4s ease}
      #splash.hide{opacity:0;transform:scale(1.04);pointer-events:none;transition:opacity .45s ease,transform .45s ease}
      .sp-grid{position:absolute;top:-50%;right:-50%;bottom:-50%;left:-50%;opacity:0;background-image:linear-gradient(rgba(186,230,253,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(186,230,253,.05) 1px,transparent 1px);background-size:64px 64px;animation:sp-gridin 1.2s ease-out .1s forwards,sp-griddrift 14s linear infinite}
      .sp-beam{position:absolute;top:-20%;bottom:-20%;left:0;width:30%;opacity:0;background:linear-gradient(90deg,rgba(47,128,237,0),rgba(47,128,237,.18) 45%,rgba(186,230,253,.10) 55%,rgba(47,128,237,0));animation:sp-beam 2.6s cubic-bezier(.3,.1,.2,1) .1s forwards}
      .sp-beam.b2{width:14%;background:linear-gradient(90deg,rgba(186,230,253,0),rgba(186,230,253,.14),rgba(186,230,253,0));animation-delay:.45s}
      .sp-mark{position:relative;transform:scale(.7);opacity:0;animation:sp-spring .7s cubic-bezier(.2,1.25,.35,1) .15s forwards}
      .sp-tile{fill:#121b29}
      .sp-ring{stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:sp-draw 1s cubic-bezier(.4,0,.2,1) .35s forwards,sp-on .05s .35s forwards}
      .sp-tri{stroke-dasharray:1;stroke-dashoffset:1;animation:sp-draw .8s cubic-bezier(.4,0,.2,1) .5s forwards}
      .sp-core{transform-box:fill-box;transform-origin:center;opacity:0;transform:scale(.5);animation:sp-pop .45s cubic-bezier(.2,1.3,.4,1) 1.05s forwards}
      .sp-sheen{transform:translateX(-60px);animation:sp-sheen .9s ease-in-out 1.35s forwards}
      .sp-word{position:relative;width:182px;height:auto;overflow:visible}
      .sp-let{fill:url(#spw);fill-opacity:0;stroke:url(#spw);stroke-width:.9;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:sp-draw .95s cubic-bezier(.4,0,.2,1) var(--d) forwards,sp-on .05s var(--d) forwards,sp-fill .5s ease-out calc(var(--d) + .55s) forwards}
      .sp-let.l1{--d:1.1s}.sp-let.l2{--d:1.4s}.sp-let.l3{--d:1.65s}.sp-let.l4{--d:1.9s}
      .sp-wsheen{transform:translateX(-30px);animation:sp-wsheen .8s ease-in-out 2.7s forwards}
      .sp-tag{font:600 15px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.7em;margin-inline-start:.7em;color:rgba(186,230,253,.7);opacity:0;transform:translateY(6px);animation:sp-rise .6s cubic-bezier(.2,0,0,1) 2.3s forwards}
      .sp-line{position:relative;width:132px;height:3px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,.1);opacity:0;animation:sp-fade .3s ease-out 2s forwards}
      .sp-line i{position:absolute;top:0;bottom:0;left:0;width:45%;border-radius:2px;background:linear-gradient(90deg,#2f80ed,#bae6fd);animation:sp-load 1.1s cubic-bezier(.4,0,.2,1) 2s infinite}
      @keyframes sp-beam{0%{opacity:0;transform:skewX(-18deg) translateX(-130%)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:skewX(-18deg) translateX(420%)}}
      @keyframes sp-spring{to{opacity:1;transform:none}}
      @keyframes sp-fade{to{opacity:1}}
      @keyframes sp-draw{to{stroke-dashoffset:0}}
      @keyframes sp-pop{to{opacity:1;transform:scale(1)}}
      @keyframes sp-sheen{to{transform:translateX(200px)}}
      @keyframes sp-fill{to{fill-opacity:1;stroke-opacity:0}}
      @keyframes sp-wsheen{to{transform:translateX(171px)}}
      @keyframes sp-on{to{opacity:1}}
      @keyframes sp-rise{to{opacity:1;transform:none}}
      @keyframes sp-gridin{to{opacity:1}}
      @keyframes sp-griddrift{to{transform:translate(64px,64px)}}
      @keyframes sp-load{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
      /* reduced motion / motion=off: show the final frame immediately */
      @media (prefers-reduced-motion: reduce){#splash *{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important;clip-path:none!important}#splash .sp-let{fill-opacity:1!important;stroke-opacity:0!important}#splash .sp-beam,#splash .sp-sheen,#splash .sp-wsheen,#splash .sp-grid{display:none!important}}
      #splash.static *{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important;clip-path:none!important}
      #splash.static .sp-let{fill-opacity:1!important;stroke-opacity:0!important}
      #splash.static .sp-beam,#splash.static .sp-sheen,#splash.static .sp-wsheen,#splash.static .sp-grid{display:none!important}
    </style>

    <style>html{background:#0e0f11;color:#fff}html:not(.dark){background:#f4f5f7;color:#1f1f1f}</style>
    <script>
      // set the theme before first paint (no flash); mirrors src/lib/theme.ts
      var t
      try { t = JSON.parse(localStorage.getItem("iptv-app")).state.settings.theme } catch (e) {}
      var tv = /Web0S|webOS|SmartTV/i.test(navigator.userAgent)
      // language / direction before first paint; mirrors src/lib/i18n
      var lg; try { lg = JSON.parse(localStorage.getItem("iptv-app")).state.settings.language } catch (e) {}
      var ar = lg === "ar" || (lg !== "en" && /^ar/i.test(navigator.language))
      document.documentElement.lang = ar ? "ar-EG" : "en"
      document.documentElement.dir = ar ? "rtl" : "ltr"
      document.documentElement.dataset.lang = ar ? "ar" : "en"
      document.documentElement.classList.toggle("dark", t === "dark" || (t !== "light" && (tv || matchMedia("(prefers-color-scheme: dark)").matches)))
    </script>
  </head>
