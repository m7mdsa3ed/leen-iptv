<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" href="./icon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Leen IPTV</title>
    <script>
      // set the theme before first paint (no flash); mirrors src/lib/theme.ts
      var t
      try { t = JSON.parse(localStorage.getItem("iptv-app")).state.settings.theme } catch (e) {}
      var tv = /Web0S|webOS|SmartTV/i.test(navigator.userAgent)
      document.documentElement.classList.toggle("dark", t === "dark" || (t !== "light" && (tv || matchMedia("(prefers-color-scheme: dark)").matches)))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <script>
      if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/Web0S|webOS|SmartTV/i.test(navigator.userAgent))
        window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js") })
    </script>
  </body>
</html>
