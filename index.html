<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" href="./icon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Leen</title>
    <style>
      /* animated boot splash: draw the triangle, pop the core, glow, then the wordmark. Only transform/opacity (+ one stroke draw on a tiny SVG). */
      #splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;background:#0e0f11;color:#fff;transition:opacity .35s ease}
      #splash.hide{opacity:0;pointer-events:none}
      .sp-glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.38) 0%,rgba(34,211,238,.14) 40%,rgba(14,15,17,0) 70%);opacity:0;animation:sp-glow 1.6s ease-out .3s forwards}
      .sp-mark{position:relative}
      .sp-tile{opacity:0;animation:sp-fade .35s ease-out forwards}
      .sp-tri{stroke-dasharray:1;stroke-dashoffset:1;animation:sp-draw .9s cubic-bezier(.4,0,.2,1) .2s forwards}
      .sp-core{transform-box:fill-box;transform-origin:center;opacity:0;transform:scale(.4);animation:sp-pop .45s cubic-bezier(.2,1.3,.4,1) .85s forwards}
      .sp-word{position:relative;display:flex;gap:.12em;font:600 54px/1 "Google Sans","Product Sans",Roboto,system-ui,sans-serif;letter-spacing:.06em}
      .sp-word span{opacity:0;transform:translateY(14px);animation:sp-rise .5s cubic-bezier(.2,0,0,1) forwards}
      .sp-word span:nth-child(1){animation-delay:1.05s}.sp-word span:nth-child(2){animation-delay:1.12s}.sp-word span:nth-child(3){animation-delay:1.19s}.sp-word span:nth-child(4){animation-delay:1.26s}
      @keyframes sp-fade{to{opacity:1}}
      @keyframes sp-draw{to{stroke-dashoffset:0}}
      @keyframes sp-pop{to{opacity:1;transform:scale(1)}}
      @keyframes sp-rise{to{opacity:1;transform:none}}
      @keyframes sp-glow{0%{opacity:0;transform:scale(.7)}60%{opacity:1}100%{opacity:.85;transform:scale(1)}}
      /* reduced motion / motion=off: show the final frame immediately */
      @media (prefers-reduced-motion: reduce){#splash *{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
      #splash.static *{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
    </style>

    <style>html{background:#0e0f11;color:#fff}html:not(.dark){background:#f4f5f7;color:#1f1f1f}</style>
    <script>
      // set the theme before first paint (no flash); mirrors src/lib/theme.ts
      var t
      try { t = JSON.parse(localStorage.getItem("iptv-app")).state.settings.theme } catch (e) {}
      var tv = /Web0S|webOS|SmartTV/i.test(navigator.userAgent)
      document.documentElement.classList.toggle("dark", t === "dark" || (t !== "light" && (tv || matchMedia("(prefers-color-scheme: dark)").matches)))
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-glow"></div>
      <svg class="sp-mark" viewBox="0 0 100 100" width="148" height="148">
        <defs>
          <linearGradient id="spg" gradientUnits="userSpaceOnUse" x1="30" y1="24" x2="80" y2="76">
            <stop offset="0" stop-color="#22d3ee" /><stop offset=".55" stop-color="#a855f7" /><stop offset="1" stop-color="#f472b6" />
          </linearGradient>
        </defs>
        <rect class="sp-tile" width="100" height="100" rx="26" fill="#0e1020" />
        <path class="sp-tri" pathLength="1" d="M36 28V72L76 50Z" fill="none" stroke="url(#spg)" stroke-width="9" stroke-linejoin="round" />
        <path class="sp-core" d="M46 41V59L61 50Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round" />
      </svg>
      <div class="sp-word"><span>L</span><span>e</span><span>e</span><span>n</span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <script>
      if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/Web0S|webOS|SmartTV/i.test(navigator.userAgent))
        window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js") })
    </script>
  </body>
</html>
